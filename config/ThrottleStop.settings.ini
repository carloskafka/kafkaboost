; ThrottleStop.ini settings applied by scripts\Install-Tuning.ps1 (profile 0 = "Performance").
; Machine: Lenovo Legion 83DE, i9-14900HX. Values were verified live on 2026-10-10 (see AGENTS.md).
; Encoding notes: AGENTS.md section 2.  FIVR planes: 00=Core 20=P-cache 50=E-cache.
; OneAD_EAX0/EDX0 = P-core turbo ratios (0x2F = 47x), Six50_EAX0 = E-core turbo ratio (0x24 = 36x).
; PowerLimitEAX0/EDX0 = PL1/PL2 (bits[14:0] = W x 8): 0x208 = 65 W, 0x2A8 = 85 W.
; NoSetPL=0xE leaves TPL controls enabled for profile 0 (the old "Disable Controls" checkbox blocked PL changes).

FIVRVoltage00=0xF3400000
UnlockVoltage00=1
FIVRVoltage20=0xF3400000
UnlockVoltage20=1
FIVRVoltage50=0xF4800000
UnlockVoltage50=1
IccMaxNew00=0x000007FF
UseVFCore=1
UseVFCache=0
VFPoint110=0x0CC00000
OneAD_EAX0=0x2F2F2F2F
OneAD_EDX0=0x2F2F2F2F
Six50_EAX0=0x00000024
PowerLimitEAX0=0x00DF8208
PowerLimitEDX0=0x004282A8
NoSetPL=0xE
SaveOnExit=2
