name: Check

# The gate: the PowerShell library tests, a syntax check of every script and the app's JavaScript.
# Runs on a Windows runner because the scripts use Windows-only APIs (CIM, scheduled tasks, WScript).
# It never changes the machine: tests use a temporary sandbox and the demo mode.

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "app/**"
      - "tools/**"
      - ".github/workflows/ci.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 -Exclude node_modules | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $bad++; Write-Host "::error file=$($_.FullName)::$($errors[0].Message)" }
          }
          if ($bad) { exit 1 }

      - name: Unit tests (Pester)
        shell: pwsh
        run: |
          Import-Module Pester
          Invoke-Pester -Path tests -CI -Output Detailed

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check the app's JavaScript
        working-directory: app
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/demo.js
          node --check renderer/app.js
