name: Publish the documentation

# The site is a folder of static files, so publishing is copying docs/ and nothing else.
# Only a change to the site itself is worth republishing.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/pages.yml
  # Lets it be republished from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a run in progress is not cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Collect the site
        uses: actions/upload-pages-artifact@v5
        with:
          # docs/, not the repository root: the scripts and the app are not part of the site.
          path: docs

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
